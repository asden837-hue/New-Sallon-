<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز موعد - صالون مصطفى للحلاقة</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');

    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d4a96a;
      --gold-light: #f0d9a8;
      --gold-dark: #b48246;
      --bg-dark: #0a0a0f;
      --text-light: #f5efe4;
      --royal: #1a1a2e;
      --card-bg: rgba(212, 169, 106, 0.06);
    }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== BACKGROUND ===== */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(135deg, rgba(10,10,15,0.94) 0%, rgba(18,14,8,0.85) 50%, rgba(26,20,10,0.92) 100%),
        url('bg.jpg') center/cover no-repeat fixed;
      z-index: -1;
    }

    /* Subtle animated golden glow overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 15% 40%, rgba(212, 169, 106, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 85% 60%, rgba(212, 169, 106, 0.06) 0%, transparent 50%);
      z-index: -1;
      animation: shimmer 7s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      0% { opacity: 0.4; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* ===== FLOATING GOLD PARTICLES ===== */
    .particle {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 169, 106, 0.9), rgba(180, 130, 70, 0));
      pointer-events: none;
      z-index: 0;
      animation: floatUp linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) scale(0);
        opacity: 0;
      }
      10% { opacity: 0.7; }
      90% { opacity: 0.4; }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* ===== CONTAINER ===== */
    .booking-container {
      width: 100%;
      max-width: 560px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 50px 40px 45px;
      border: 1px solid rgba(180, 130, 70, 0.2);
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(180, 130, 70, 0.1);
      position: relative;
      overflow: hidden;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      animation: fadeInUp 0.8s ease both;
      z-index: 1;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .booking-container:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(180, 130, 70, 0.15);
    }

    /* Top accent line */
    .booking-container::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #b48246, #d4a96a, #b48246, transparent);
      border-radius: 0 0 4px 4px;
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    /* ===== WORKING HOURS BAR ===== */
    .hours-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
      padding: 10px 16px;
      background: linear-gradient(135deg, rgba(212, 169, 106, 0.10), rgba(212, 169, 106, 0.03));
      border: 1px solid rgba(212, 169, 106, 0.2);
      border-radius: 14px;
      animation: fadeInUp 0.8s ease 0.15s both;
    }

    .hours-bar .hours-icon {
      font-size: 20px;
      animation: clockTick 2s ease-in-out infinite;
    }

    @keyframes clockTick {
      0%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(15deg); }
      20% { transform: rotate(-10deg); }
      30% { transform: rotate(8deg); }
      40% { transform: rotate(0deg); }
    }

    .hours-bar span {
      color: var(--gold);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .hours-bar small {
      color: rgba(240, 230, 211, 0.55);
      font-size: 12px;
      font-weight: 400;
    }

    /* Scissors icon */
    .icon-scissors {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(180, 130, 70, 0.2), rgba(180, 130, 70, 0.05));
      border: 1px solid rgba(180, 130, 70, 0.25);
      margin-bottom: 18px;
      font-size: 32px;
      color: #d4a96a;
      transition: all 0.3s ease;
      animation: bounceIn 1s ease both;
    }

    @keyframes bounceIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .booking-container:hover .icon-scissors {
      background: linear-gradient(135deg, rgba(180, 130, 70, 0.3), rgba(180, 130, 70, 0.1));
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(180, 130, 70, 0.15);
    }

    .header h1 {
      font-size: 30px;
      font-weight: 900;
      color: #f0e6d3;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .header h1 span {
      background: linear-gradient(135deg, #d4a96a, #b48246, #d4a96a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: rgba(240, 230, 211, 0.5);
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    /* ===== SERVICE SELECTION (بطاقات الخدمات) ===== */
    .services-section {
      margin-bottom: 28px;
    }

    .services-section .section-label {
      display: block;
      color: rgba(240, 230, 211, 0.7);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .services-hint {
      display: block;
      color: rgba(212, 169, 106, 0.6);
      font-size: 12px;
      font-weight: 500;
      margin-top: 10px;
      text-align: center;
    }

    .selected-summary {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(180, 130, 70, 0.12), rgba(180, 130, 70, 0.04));
      border: 1px solid rgba(212, 169, 106, 0.25);
      color: #f0e6d3;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.7;
      text-align: center;
      transition: all 0.3s ease;
    }

    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(180, 130, 70, 0.15);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.35s ease;
      text-align: center;
      user-select: none;
      opacity: 0;
      animation: cardEntrance 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Staggered entrance for service cards */
    .service-card:nth-child(1) { animation-delay: 0.20s; }
    .service-card:nth-child(2) { animation-delay: 0.30s; }
    .service-card:nth-child(3) { animation-delay: 0.40s; }
    .service-card:nth-child(4) { animation-delay: 0.50s; }

    @keyframes cardEntrance {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .service-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(180, 130, 70, 0.35);
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 22px rgba(212, 169, 106, 0.18);
    }

    .service-card:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* Golden glow on hover */
    .service-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 0%, rgba(212, 169, 106, 0.12), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .service-card:hover::before {
      opacity: 1;
    }

    .service-card .service-emoji {
      font-size: 30px;
      transition: transform 0.35s ease;
    }

    .service-card:hover .service-emoji {
      transform: scale(1.2) rotate(-8deg);
    }

    .service-card .service-name {
      font-size: 15px;
      font-weight: 700;
      color: #f0e6d3;
    }

    /* Selected state */
    .service-card.selected {
      background: linear-gradient(135deg, rgba(180, 130, 70, 0.25), rgba(180, 130, 70, 0.1));
      border-color: #d4a96a;
      box-shadow: 0 0 0 2px rgba(212, 169, 106, 0.2), 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .service-card.selected .service-name {
      color: #d4a96a;
    }

    .service-card.selected::after {
      content: '✓';
      position: absolute;
      top: 8px;
      left: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4a96a, #b48246);
      color: #0d0d0d;
      font-size: 13px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    /* ===== VIP CARD (للعرايس) ===== */
    .service-card.vip-card {
      background: linear-gradient(135deg, rgba(212, 169, 106, 0.18), rgba(180, 130, 70, 0.06));
      border: 1px solid rgba(212, 169, 106, 0.45);
      position: relative;
      overflow: hidden;
    }

    .service-card.vip-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent 0%, rgba(212, 169, 106, 0.15) 15%, transparent 30%, transparent 50%, rgba(212, 169, 106, 0.15) 65%, transparent 80%);
      animation: vipShine 4s linear infinite;
      pointer-events: none;
    }

    @keyframes vipShine {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .service-card.vip-card .service-name {
      color: #d4a96a;
      font-weight: 900;
      font-size: 16px;
    }

    .service-card.vip-card .vip-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: linear-gradient(135deg, #d4a96a, #b48246);
      color: #0d0d0d;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      box-shadow: 0 3px 12px rgba(212, 169, 106, 0.4);
      z-index: 2;
    }

    .service-card.vip-card.selected {
      background: linear-gradient(135deg, rgba(212, 169, 106, 0.4), rgba(180, 130, 70, 0.15));
      border-color: #d4a96a;
      box-shadow: 0 0 25px rgba(212, 169, 106, 0.35), 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .service-card.vip-card .service-emoji {
      animation: crownFloat 2.5s ease-in-out infinite;
    }

    @keyframes crownFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* ===== FORM ===== */
    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-group label {
      display: block;
      color: rgba(240, 230, 211, 0.7);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }

    .form-group:focus-within label {
      color: #d4a96a;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .input-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: rgba(180, 130, 70, 0.4);
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .form-group:focus-within .input-icon {
      color: #d4a96a;
    }

    /* For date/time icons - use left side */
    .input-wrapper.date-icon .input-icon,
    .input-wrapper.time-icon .input-icon {
      right: 16px;
      left: auto;
    }

    .form-group input {
      width: 100%;
      padding: 16px 50px 16px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(180, 130, 70, 0.15);
      border-radius: 14px;
      color: #f0e6d3;
      font-size: 16px;
      font-family: 'Cairo', sans-serif;
      font-weight: 400;
      outline: none;
      transition: all 0.35s ease;
    }

    .form-group input::placeholder {
      color: rgba(240, 230, 211, 0.25);
      font-weight: 300;
    }

    .form-group input:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(180, 130, 70, 0.25);
    }

    .form-group input:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: #b48246;
      box-shadow: 0 0 0 3px rgba(180, 130, 70, 0.12), 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    /* Style date/time inputs */
    .form-group input[type="date"],
    .form-group input[type="time"] {
      direction: ltr;
      text-align: left;
      padding: 16px 18px 16px 50px;
      color-scheme: dark;
    }

    .form-group input[type="date"]::-webkit-calendar-picker-indicator,
    .form-group input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7) sepia(0.3) hue-rotate(350deg) saturate(0.8);
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .form-group input[type="date"]::-webkit-calendar-picker-indicator:hover,
    .form-group input[type="time"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* ===== ROW: Date + Time ===== */
    .row-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ===== SUBMIT BUTTON ===== */
    .btn-submit {
      width: 100%;
      padding: 17px 30px;
      margin-top: 10px;
      background: linear-gradient(135deg, #b48246, #d4a96a);
      border: none;
      border-radius: 14px;
      color: #0d0d0d;
      font-family: 'Cairo', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.6s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(180, 130, 70, 0.35);
    }

    .btn-submit:hover::before {
      left: 100%;
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 4px 15px rgba(180, 130, 70, 0.25);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Ripple effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      background: rgba(255, 255, 255, 0.45);
      pointer-events: none;
      animation: rippleAnim 0.7s ease-out forwards;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* Loading spinner inside button */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(13, 13, 13, 0.25);
      border-top-color: #0d0d0d;
      border-radius: 50%;
      vertical-align: middle;
      margin-left: 8px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== CONFETTI ===== */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 14px;
      top: -20px;
      z-index: 9999;
      pointer-events: none;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0.2;
      }
    }

    /* ===== MESSAGE / TOAST ===== */
    .toast {
      margin-top: 20px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success {
      background: rgba(46, 204, 113, 0.12);
      border: 1px solid rgba(46, 204, 113, 0.25);
      color: #2ecc71;
    }

    .toast.error {
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.25);
      color: #e74c3c;
    }

    .toast.info {
      background: rgba(52, 152, 219, 0.12);
      border: 1px solid rgba(52, 152, 219, 0.25);
      color: #3498db;
    }

    /* ===== DECORATIVE ELEMENTS ===== */
    .deco-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 28px;
    }

    .deco-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(180, 130, 70, 0.25);
      transition: all 0.3s ease;
    }

    .deco-dots span:nth-child(2) {
      background: rgba(180, 130, 70, 0.4);
    }

    .booking-container:hover .deco-dots span {
      background: rgba(180, 130, 70, 0.35);
    }

    .booking-container:hover .deco-dots span:nth-child(2) {
      background: rgba(180, 130, 70, 0.55);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 560px) {
      .booking-container {
        padding: 35px 24px 35px;
        border-radius: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .row-duo {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .services-grid {
        grid-template-columns: 1fr 1fr;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .btn-submit {
        font-size: 16px;
        padding: 15px 24px;
      }
    }

    /* ===== MOBILE BACKGROUND FIX (lighten dark overlay + disable fixed attachment) ===== */
    @media (max-width: 768px) {
      body {
        background: #120d08;
      }

      body::before {
        background:
          linear-gradient(135deg, rgba(10, 10, 15, 0.45) 0%, rgba(40, 26, 12, 0.35) 50%, rgba(50, 30, 14, 0.45) 100%),
          url('bg.jpg') center/cover no-repeat scroll;
        background-attachment: scroll;
      }

      .particle {
        display: none;
      }
    }

    @media (max-width: 400px) {
      .booking-container {
        padding: 28px 18px 28px;
      }

      .header h1 {
        font-size: 21px;
      }

      .icon-scissors {
        width: 60px;
        height: 60px;
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <div class="booking-container">
    <!-- Header -->
    <div class="header">
      <div class="icon-scissors">✂️</div>
      <h1>Saloon <span>ORO</span></h1>
      <p>احجز موعدك بكل سهولة</p>
    </div>

    <!-- Working Hours -->
    <div class="hours-bar">
      <span class="hours-icon">🕐</span>
      <span>ساعات العمل: 10 صباحاً - 10 مساءً</span>
      <small>| آخر موعد للحجز 9 مساءً</small>
    </div>

    <!-- Booking Form -->
    <form id="bookingForm" novalidate>

      <!-- Service Selection (بطاقات اختيار الخدمة) -->
      <div class="services-section">
        <label class="section-label">اختر الخدمة المطلوبة (يمكنك اختيار أكثر من خدمة)</label>
        <div class="services-grid" id="servicesGrid">
          <div class="service-card" data-service="hair" tabindex="0">
            <div class="service-emoji">💇</div>
            <div class="service-name">قص شعر</div>
          </div>
          <div class="service-card" data-service="hair_beard" tabindex="0">
            <div class="service-emoji">💈</div>
            <div class="service-name">شعر وذقن</div>
          </div>
          <div class="service-card" data-service="skin_mask" tabindex="0">
            <div class="service-emoji">🧖‍♂️</div>
            <div class="service-name">ماسك للبشرة</div>
          </div>
          <div class="service-card vip-card" data-service="groom_vip" tabindex="0">
            <div class="vip-badge">VIP</div>
            <div class="service-emoji">👑</div>
            <div class="service-name">VIP للعريس</div>
          </div>
        </div>
        <span class="services-hint">✨ يمكنك اختيار أكثر من خدمة، وعند اختيار خدمة إضافية تصبح مدة الحجز ساعة ونصف</span>
        <div class="selected-summary" id="selectedSummary">لم تختر أي خدمة بعد</div>
      </div>

      <!-- Name -->
      <div class="form-group">
        <label for="customerName">الاسم الكامل</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="customerName" name="customerName" placeholder="أدخل اسمك هنا" required autocomplete="name">
        </div>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="customerPhone">رقم الهاتف</label>
        <div class="input-wrapper">
          <span class="input-icon">📞</span>
          <input type="tel" id="customerPhone" name="customerPhone" placeholder="+963xxxxxxxxx" required autocomplete="tel">
        </div>
      </div>

      <!-- Row: Date + Time -->
      <div class="row-duo">
        <div class="form-group">
          <label for="bookingDate">التاريخ</label>
          <div class="input-wrapper date-icon">
            <span class="input-icon">📅</span>
            <input type="date" id="bookingDate" name="bookingDate" required>
          </div>
        </div>

        <div class="form-group">
          <label for="bookingTime">الوقت</label>
          <div class="input-wrapper time-icon">
            <span class="input-icon">⏰</span>
            <input type="time" id="bookingTime" name="bookingTime" min="10:00" max="21:00" step="1800" required>
          </div>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit" id="submitBtn">
        تأكيد الحجز
      </button>

      <!-- Toast Message -->
      <div class="toast" id="toast"></div>
    </form>

    <!-- Decorative Dots -->
    <div class="deco-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

  <script>
    (function() {
      const API_BASE = '/api';
      const form = document.getElementById('bookingForm');
      const submitBtn = document.getElementById('submitBtn');
      const toast = document.getElementById('toast');
      const servicesGrid = document.getElementById('servicesGrid');
      let selectedServices = [];

      // ===== Service display labels =====
      const SERVICES_LABELS = {
        hair: '💇 قص شعر',
        hair_beard: '💈 شعر وذقن',
        skin_mask: '🧖‍♂️ ماسك للبشرة',
        groom_vip: '👑 VIP للعريس'
      };

      // ===== Floating gold particles =====
      function createParticles() {
        const count = window.innerWidth < 560 ? 12 : 20;
        for (let i = 0; i < count; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          const size = Math.random() * 6 + 2;
          particle.style.width = size + 'px';
          particle.style.height = size + 'px';
          particle.style.left = Math.random() * 100 + 'vw';
          particle.style.animationDuration = (Math.random() * 12 + 8) + 's';
          particle.style.animationDelay = (Math.random() * 12) + 's';
          document.body.appendChild(particle);
        }
      }
      createParticles();

      // ===== Service card selection (multi-select) =====
      const serviceCards = document.querySelectorAll('.service-card');
      const selectedSummary = document.getElementById('selectedSummary');

      function updateSelectedSummary() {
        if (selectedServices.length === 0) {
          selectedSummary.textContent = 'لم تختر أي خدمة بعد';
          selectedSummary.style.opacity = '0.65';
        } else {
          const labels = selectedServices.map(s => SERVICES_LABELS[s] || s);
          selectedSummary.textContent = '✓ الخدمات المختارة: ' + labels.join(' + ');
          selectedSummary.style.opacity = '1';
        }
      }

      function toggleService(card) {
        const service = card.dataset.service;
        const idx = selectedServices.indexOf(service);
        if (idx > -1) {
          selectedServices.splice(idx, 1);
          card.classList.remove('selected');
        } else {
          selectedServices.push(service);
          card.classList.add('selected');
        }
        updateSelectedSummary();
      }

      serviceCards.forEach(card => {
        card.addEventListener('click', () => toggleService(card));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleService(card);
          }
        });
      });

      updateSelectedSummary();

      // Set default date to today (skip Friday) and time respecting working hours 10:00-21:00
      function setDefaults() {
        const now = new Date();
        
        // Find next non-Friday day
        const today = new Date(now);
        let dateObj = new Date(today);
        while (dateObj.getDay() === 5) {
          dateObj.setDate(dateObj.getDate() + 1);
        }
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        document.getElementById('bookingDate').value = `${year}-${month}-${day}`;
        document.getElementById('bookingDate').min = `${year}-${month}-${day}`;

        // Time: current hour + 1, rounded to next half hour, within 10:00 - 21:00
        let hours = now.getHours();
        let minutes = now.getMinutes();
        hours += 1;
        if (minutes > 30) {
          hours += 1;
          minutes = 0;
        } else {
          minutes = 30;
        }
        if (hours < 10) {
          hours = 10;
          minutes = 0;
        }
        if (hours > 21) {
          hours = 21;
          minutes = 0;
        }
        if (hours === 21 && minutes > 30) minutes = 30;
        if (hours >= 22) hours = 21;
        const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        document.getElementById('bookingTime').value = timeStr;
      }

      setDefaults();

      // ===== Ripple effect on submit button =====
      function createRipple(event) {
        const btn = event.currentTarget;
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (event.clientY - rect.top - size / 2) + 'px';
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 700);
      }
      submitBtn.addEventListener('click', createRipple);

      // ===== Gold confetti on success =====
      function launchConfetti() {
        const colors = ['#d4a96a', '#f0d9a8', '#b48246', '#ffd700', '#e0c07a'];
        const count = window.innerWidth < 560 ? 40 : 70;
        for (let i = 0; i < count; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = Math.random() * 100 + 'vw';
          piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          piece.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
          piece.style.animationDelay = (Math.random() * 0.5) + 's';
          piece.style.width = (Math.random() * 6 + 6) + 'px';
          piece.style.height = (Math.random() * 8 + 8) + 'px';
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 5500);
        }
      }

      // Show toast message
      function showToast(message, type = 'success') {
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 5000);
      }

      // Client-side validation
      function validateForm() {
        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const date = document.getElementById('bookingDate').value;
        const time = document.getElementById('bookingTime').value;

        if (selectedServices.length === 0) {
          showToast('❌ الرجاء اختيار خدمة واحدة على الأقل', 'error');
          return false;
        }

        if (!name || name.length < 2) {
          showToast('❌ الرجاء إدخال اسم صحيح (حرفين على الأقل)', 'error');
          document.getElementById('customerName').focus();
          return false;
        }

        if (!phone) {
          showToast('❌ الرجاء إدخال رقم الهاتف', 'error');
          document.getElementById('customerPhone').focus();
          return false;
        }

        const phoneClean = phone.replace(/\s/g, '');
        const phoneRegex = /^(09\d{8}|\+9639\d{8})$/;
        if (!phoneRegex.test(phoneClean)) {
          showToast('❌ رقم الهاتف غير صالح (09xxxxxxxx أو +9639xxxxxxxx)', 'error');
          document.getElementById('customerPhone').focus();
          return false;
        }

        if (!date || !time) {
          showToast('❌ الرجاء اختيار التاريخ والوقت', 'error');
          return false;
        }

        const selectedDate = new Date(`${date}T${time}`);
        if (selectedDate <= new Date()) {
          showToast('❌ الرجاء اختيار تاريخ ووقت في المستقبل', 'error');
          return false;
        }

        const [hour] = time.split(':').map(Number);
        if (hour < 10 || hour > 21) {
          showToast('❌ ساعات العمل من 10 صباحاً حتى 9 مساءً', 'error');
          return false;
        }

        if (selectedDate.getDay() === 5) {
          showToast('❌ الصالون مغلق يوم الجمعة، الرجاء اختيار يوم آخر', 'error');
          return false;
        }

        return true;
      }

      // Submit booking to backend
      async function submitBooking(data) {
        const response = await fetch(`${API_BASE}/bookings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        return await response.json();
      }

      // Handle form submission
      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        if (!validateForm()) return;

        // Disable button + show spinner
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> جاري إرسال الطلب...';

        const formData = {
          name: document.getElementById('customerName').value.trim(),
          phone: document.getElementById('customerPhone').value.trim(),
          services: selectedServices,
          date: document.getElementById('bookingDate').value,
          time: document.getElementById('bookingTime').value,
        };

        try {
          const result = await submitBooking(formData);

          if (result.success) {
            showToast('✅ ' + result.message, 'success');
            launchConfetti();
            // Reset form but keep defaults
            form.reset();
            setDefaults();
            // Clear selected services
            selectedServices = [];
            serviceCards.forEach(c => c.classList.remove('selected'));
            updateSelectedSummary();
          } else {
            showToast('❌ ' + result.message, 'error');
          }
        } catch (err) {
          showToast('❌ حدث خطأ في الاتصال بالخادم، الرجاء المحاولة لاحقاً', 'error');
          console.error('Error:', err);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'تأكيد الحجز';
        }
      });

      // Real-time phone formatting (allow digits and +)
      document.getElementById('customerPhone').addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9+]/g, '');
        if (this.value.indexOf('+') > 0) {
          this.value = this.value.replace(/\+/g, '');
        }
      });

      // Check available slots when date changes
      document.getElementById('bookingDate').addEventListener('change', async function() {
        const date = this.value;
        const timeInput = document.getElementById('bookingTime');
        
        if (!date) return;

        try {
          const response = await fetch(`${API_BASE}/check?date=${date}&count=${Math.max(1, selectedServices.length)}`);
          const result = await response.json();
          
          if (result.success && result.data.available.length > 0) {
            // If current time is booked, suggest an available one
            const currentTime = timeInput.value;
            if (!result.data.available.includes(currentTime)) {
              timeInput.value = result.data.available[0];
              showToast(`💡 تم تغيير الوقت إلى ${result.data.available[0]} لأنه غير متاح`, 'info');
            }
          } else if (result.success && result.data.available.length === 0) {
            showToast('⚠️ لا توجد أوقات متاحة في هذا التاريخ', 'error');
          }
        } catch (err) {
          console.error('Error checking availability:', err);
        }
      });

    })();
  </script>

</body>
</html>
